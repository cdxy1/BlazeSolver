<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title description">
  <title id="title">BlazeSolver startup</title>
  <desc id="description">A terminal preview of the BlazeSolver flame banner and startup logs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb45d"/>
      <stop offset="1" stop-color="#ff7048"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 19px; white-space: pre; }
      .flame { fill: url(#accent); font-size: 25px; }
      .muted { fill: #8294ae; }
      .text { fill: #d8e3f3; }
      .green { fill: #73ddba; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="488" rx="18" fill="url(#background)" stroke="#2b3b53" stroke-width="2"/>
  <path d="M19 2h1162a17 17 0 0 1 17 17v35H2V19A17 17 0 0 1 19 2" fill="#152238"/>
  <circle cx="29" cy="28" r="6" fill="#ff786a"/>
  <circle cx="51" cy="28" r="6" fill="#f4c769"/>
  <circle cx="73" cy="28" r="6" fill="#70dca1"/>
  <text x="600" y="34" class="mono muted" text-anchor="middle" font-size="14">blazesolver — terminal</text>
  <text x="38" y="96" class="mono"><tspan class="green">$ </tspan><tspan class="text">./bin/blazesolver</tspan></text>
  <text x="62" y="145" class="mono flame">        (</text>
<text x="62" y="172" class="mono flame">       ( )</text>
<text x="62" y="199" class="mono flame">      (   )</text>
<text x="62" y="226" class="mono flame">     (  (  )</text>
<text x="62" y="253" class="mono flame">      \   /</text>
<text x="62" y="280" class="mono flame">       \_/</text>
  <text x="322" y="178" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="42" font-weight="700" fill="#f0f5ff">BlazeSolver</text>
  <text x="325" y="218" class="mono muted">Undetected Chromium · Go</text>
  <text x="325" y="254" class="mono green">v1.0.0</text>
  <path d="M38 316h1124" stroke="#24354c"/>
  <text x="38" y="356" class="mono"><tspan class="muted">time=12:00:00.021 </tspan><tspan class="green">level=INFO </tspan><tspan class="text">msg="Checking undetected browser"</tspan></text>
  <text x="38" y="394" class="mono"><tspan class="muted">time=12:00:00.684 </tspan><tspan class="green">level=INFO </tspan><tspan class="text">msg=Ready address=0.0.0.0:8191</tspan></text>
  <circle cx="45" cy="448" r="4" fill="#73ddba"/>
  <text x="61" y="454" class="mono muted" font-size="15">Browser-backed requests. Persistent sessions. One HTTP API.</text>
</svg>
