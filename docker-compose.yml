services:
  blazesolver:
    build: .
    image: blazesolver:local
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      TZ: ${TZ:-UTC}
    ports:
      - "${PORT:-8191}:8191"
    volumes:
      - blazesolver-config:/config
    tmpfs:
      - /tmp:size=512M,mode=1777
    restart: unless-stopped
volumes:
  blazesolver-config:
